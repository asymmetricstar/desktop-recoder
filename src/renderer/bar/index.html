<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Desktop Recorder</title>
  <link rel="stylesheet" href="bar.css" />
</head>
<body>
  <div class="bar" id="bar">
    <header class="header">
      <span class="brand">Screen Recorder</span>
      <button class="btn-close" id="btn-close" title="Close" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round">
          <path d="M5 5l14 14M19 5L5 19" />
        </svg>
      </button>
    </header>

    <div class="views">
      <div class="view" id="idle-view">
        <button class="btn" data-mode="region" title="Record a selected area" aria-label="Record a selected area">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 3v12a2 2 0 0 0 2 2h12" />
            <path d="M3 7h12a2 2 0 0 1 2 2v12" />
          </svg>
        </button>
        <button class="btn" data-mode="window" title="Record a window" aria-label="Record a window">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="16" rx="2" />
            <path d="M3 9h18" />
          </svg>
        </button>
        <button class="btn" data-mode="screen" title="Record the full screen" aria-label="Record the full screen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2.5" y="4" width="19" height="13" rx="2" />
            <path d="M8.5 21h7" />
            <path d="M12 17v4" />
          </svg>
        </button>
        <span class="sep"></span>
        <button class="btn" id="btn-shot" title="Take a screenshot" aria-label="Take a screenshot">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 8h3l1.4-2h7.2L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z" />
            <circle cx="12" cy="13" r="3.3" />
          </svg>
        </button>
        <button class="btn timer" id="btn-timer" title="Countdown delay" aria-label="Countdown delay">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="13.5" r="7.5" />
            <path d="M12 10.5v3l2 1.5" />
            <path d="M9 2.5h6" />
          </svg>
          <span class="label" id="timer-label">3s</span>
        </button>
        <button class="btn" id="btn-folder" title="Open recordings folder" aria-label="Open recordings folder">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 7.5A2 2 0 0 1 5 5.5h3.6a2 2 0 0 1 1.6.8l.9 1.2H19a2 2 0 0 1 2 2v7.5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
          </svg>
        </button>
      </div>

      <div class="view rec" id="rec-view" hidden>
        <span class="rec-dot" aria-hidden="true"></span>
        <span class="rec-time" id="rec-time">00:00</span>
        <span class="sep"></span>
        <button class="btn stop" id="btn-stop" title="Stop recording" aria-label="Stop recording">
          <svg viewBox="0 0 24 24" stroke="none" fill="currentColor">
            <rect x="6.5" y="6.5" width="11" height="11" rx="2" />
          </svg>
        </button>
      </div>

      <div class="view busy" id="busy-view" hidden>
        <span class="spinner" aria-hidden="true"></span>
        <span class="busy-text" id="busy-text">Preparing</span>
        <span class="sep"></span>
        <button class="btn" id="btn-cancel" title="Cancel" aria-label="Cancel">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 6l12 12M18 6L6 18" />
          </svg>
        </button>
      </div>
    </div>
  </div>
  <script src="bar.js"></script>
</body>
</html>
