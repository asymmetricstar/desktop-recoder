<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Desktop Recorder</title>
  <link rel="stylesheet" href="countdown.css" />
</head>
<body>
  <div class="wrap">
    <div class="ring">
      <svg viewBox="0 0 100 100">
        <circle class="track" cx="50" cy="50" r="45" />
        <circle class="progress" id="progress" cx="50" cy="50" r="45" />
      </svg>
      <span class="number" id="number">3</span>
    </div>
  </div>
  <script src="countdown.js"></script>
</body>
</html>
