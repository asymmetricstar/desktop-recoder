<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Desktop Recorder</title>
  <link rel="stylesheet" href="panel.css" />
</head>
<body>
  <div class="panel">
    <section id="settings-view" hidden>
      <header>
        <span class="title">Recording settings</span>
      </header>

      <div class="section">
        <span class="label">Countdown</span>
        <div class="chips" id="chips">
          <button class="chip" data-value="0">Off</button>
          <button class="chip" data-value="3">3s</button>
          <button class="chip" data-value="5">5s</button>
          <button class="chip" data-value="10">10s</button>
        </div>
      </div>

      <div class="section">
        <span class="label">Recording folder</span>
        <div class="path" id="path">—</div>
        <div class="actions">
          <button class="action primary" id="btn-change">Change</button>
          <button class="action" id="btn-open">Open folder</button>
        </div>
      </div>
    </section>

    <section id="screenshot-view" hidden>
      <header>
        <span class="title">Screenshot</span>
      </header>
      <div class="section">
        <button class="action primary" data-shot="region">Select area</button>
        <button class="action" data-shot="window">Window</button>
        <button class="action" data-shot="screen">Full screen</button>
      </div>
    </section>

    <section id="saved-view" hidden>
      <header>
        <span class="title">Saved</span>
      </header>
      <div class="saved">
        <span class="check">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 12.5l5 5L20 6.5" />
          </svg>
        </span>
        <div class="saved-meta">
          <span class="saved-name" id="saved-name">—</span>
          <span class="saved-size" id="saved-size">—</span>
        </div>
      </div>
      <div class="actions">
        <button class="action primary" id="btn-reveal">Show in folder</button>
        <button class="action" id="btn-play">Open file</button>
      </div>
    </section>
  </div>
  <script src="panel.js"></script>
</body>
</html>
